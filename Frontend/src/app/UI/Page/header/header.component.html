<header>
      <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
            <div class="container">

                <a class="navbar-brand fw-bold text-primary" href="#">
                    BookStore
                </a>

                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarSupportedContent">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">

                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                        <li class="nav-item">
                            <a class="nav-link active" routerLink="/home">
                                Home
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" routerLink="/listproduct">
                                Xem danh sách sản phẩm
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" routerLink="/about">
                                About
                            </a>
                        </li>

                    </ul>

                   <div *ngIf="isLoggined()">

                            <div class="row">
                                <div class="col"
                                    style="display: flex; justify-content: center; align-items: center; gap: 10px;">

                                    <div class="dropdown">
                                        <button
                                            class="btn btn-secondary dropdown-toggle"
                                            type="button"
                                            id="dropdownMenu2"
                                            data-bs-toggle="dropdown"
                                            aria-expanded="false">
                                            {{authservi.getAccount()?.userName}}
                                        </button>

                                        <ul class="dropdown-menu" aria-labelledby="dropdownMenu2">
                                            <li>
                                                <button class="dropdown-item" type="button">
                                                    Thông tin
                                                </button>
                                            </li>
                                             <li>
                                                <button class="dropdown-item" type="button" (click)="isLoggout()">
                                                    Đăng xuất
                                                </button>
                                            </li>
                                        </ul>
                                        
                                    </div>

                                    <h6 style="margin: 0; text-align: center;">
                                        {{authservi.getAccount()?.roleName}}
                                    </h6>

                                </div>
                            </div>

                        </div>
                       <div *ngIf="!isLoggined()">
                        <a routerLink="/login" class="btn btn-outline-primary">
                            Đăng nhập
                        </a>
                        <a routerLink="/register" class="btn btn-outline-primary">
                            Đăng ký
                        </a>
                    </div>

                </div>
            </div>
        </nav>
</header>
