<div class="book-form-container">

  <div class="form-header">
    <h2>Thêm sách</h2>
    <p>Nhập thông tin sách mới</p>
  </div>

  <form #bookForm="ngForm" (ngSubmit)="addBook(bookForm)">

    <!-- Tên sách -->
    <div class="form-group">
      <label for="bookName">Tên sách</label>
      <input
        type="text"
        id="bookName"
        name="bookName"
        [(ngModel)]="book.bookName"
        required
        placeholder="Nhập tên sách"
      >
    </div>

    <!-- Giá -->
    <div class="form-group">
      <label for="price">Giá</label>
      <input
        type="number"
        id="price"
        name="price"
        [(ngModel)]="book.price"
        min="0"
        required
        placeholder="Nhập giá sách"
      >
    </div>

    <!-- Số lượng -->
    <div class="form-group">
      <label for="quantity">Số lượng</label>
      <input
        type="number"
        id="quantity"
        name="quantity"
        [(ngModel)]="book.quantity"
        min="0"
        required
        placeholder="Nhập số lượng"
      >
    </div>

    <!-- Danh mục -->
    <div class="form-group">
      <label for="category">Danh mục</label>
      <select
        id="category"
        name="id_Category"
        [(ngModel)]="book.id_Category"
        required
      >
        <option value="">-- Chọn danh mục --</option>
        <option
          *ngFor="let category of categories"
          [value]="category.id_Category"
        >
          {{ category.categoryName }}
        </option>
      </select>
    </div>

    <!-- ============================================ -->
    <!-- HÌNH ẢNH — Upload Inline                     -->
    <!-- ============================================ -->
    <div class="form-group">
      <label>Hình ảnh sách</label>

      <!-- Vùng kéo thả / chọn file -->
      <div
        class="upload-zone"
        [class.upload-zone--has-image]="book.imageURL"
        [class.upload-zone--uploading]="isUploading"
        (click)="fileInput.click()"
      >

        <!-- Icon upload (khi chưa có ảnh) -->
        <div class="upload-placeholder" *ngIf="!book.imageURL && !isUploading">
          <div class="upload-icon">📷</div>
          <p class="upload-hint">Nhấn để chọn ảnh</p>
          <p class="upload-hint-sub">JPG, PNG, WEBP · Tối đa 10MB</p>
        </div>

        <!-- Progress bar (khi đang upload) -->
        <div class="upload-uploading" *ngIf="isUploading">
          <div class="spinner"></div>
          <p>Đang tải ảnh lên... {{ uploadProgress }}%</p>
          <div class="progress-bar-wrap">
            <div class="progress-bar-fill" [style.width.%]="uploadProgress"></div>
          </div>
        </div>

        <!-- Preview ảnh (sau khi upload xong) -->
        <div class="upload-preview" *ngIf="book.imageURL && !isUploading">
          <img [src]="book.imageURL" alt="Book preview" class="preview-img">
          <div class="preview-overlay">
            <span class="change-text">🔄 Đổi ảnh</span>
          </div>
        </div>

      </div>

      <!-- Input file ẩn -->
      <input
        #fileInput
        type="file"
        accept=".jpg,.jpeg,.png,.webp"
        class="file-input-hidden"
        (change)="onFileSelected($event)"
      >

      <!-- Nút xóa ảnh -->
      <button
        type="button"
        class="btn-remove-image"
        *ngIf="book.imageURL && !isUploading"
        (click)="removeImage()"
      >
        ✕ Xóa ảnh
      </button>

    </div>
    <!-- END HÌNH ẢNH -->

    <!-- Mô tả -->
    <div class="form-group">
      <label for="description">Mô tả</label>
      <textarea
        id="description"
        name="description"
        [(ngModel)]="book.description"
        rows="5"
        placeholder="Nhập mô tả sách"
      ></textarea>
    </div>

    <!-- Button -->
    <div class="form-actions">

      <button
        type="button"
        class="btn-cancel"
        (click)="cancel()"
      >
        Hủy
      </button>

      <button
        type="submit"
        class="btn-submit"
        [disabled]="bookForm.invalid || isUploading"
      >
        {{ isUploading ? 'Đang upload...' : 'Thêm sách' }}
      </button>

    </div>

  </form>

</div>
